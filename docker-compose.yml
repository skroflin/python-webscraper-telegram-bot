version: '3.8'

services:
  stanovi-bot:
    build: .
    container_name: stanovi_osijek_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/listings.db
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
