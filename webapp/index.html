<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Osijek Stanovi - Karta Ponude</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #222222;
      --card-bg: #f8f9fa;
      --primary-color: #2481cc;
      --accent-color: #28a745;
      --border-color: #e0e0e0;
      --poi-color: #ff9800;
    }

    body.dark-mode {
      --bg-color: #18222d;
      --text-color: #f5f5f5;
      --card-bg: #212d3b;
      --primary-color: #5288c1;
      --accent-color: #4caf50;
      --border-color: #2f3e4e;
      --poi-color: #ffa726;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header & Filter Controls */
    #top-bar {
      padding: 10px 14px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .badge-chip {
      background: var(--primary-color);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
    }

    .quick-filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-btn {
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: var(--primary-color);
      color: #fff;
      border-color: var(--primary-color);
    }

    #map {
      flex: 1;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Custom Map Markers */
    .price-marker {
      background: #2481cc;
      color: #fff;
      font-weight: bold;
      font-size: 11px;
      padding: 4px 6px;
      border-radius: 10px;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      text-align: center;
      white-space: nowrap;
      cursor: pointer;
    }

    .price-marker.cheap {
      background: #28a745;
    }

    .price-marker.medium {
      background: #007bff;
    }

    .price-marker.expensive {
      background: #dc3545;
    }

    .poi-marker {
      background: var(--poi-color);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 8px;
      border: 1px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }

    /* Popup Styling */
    .leaflet-popup-content-wrapper {
      background: var(--card-bg);
      color: var(--text-color);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }

    .leaflet-popup-tip {
      background: var(--card-bg);
    }

    .listing-popup {
      padding: 4px 2px;
      max-width: 240px;
    }

    .popup-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
      line-height: 1.25;
    }

    .popup-meta {
      font-size: 12px;
      margin-bottom: 6px;
      color: #888;
    }

    .popup-price {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-color);
      margin-bottom: 6px;
    }

    .popup-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 8px;
    }

    .tag-badge {
      background: rgba(36, 129, 204, 0.15);
      color: var(--primary-color);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 500;
    }

    .popup-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--primary-color);
      color: #fff;
      text-decoration: none;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Top Filter Bar -->
  <div id="top-bar">
    <div class="filter-row">
      <span style="font-weight: bold; font-size: 14px;">📍 Stanovi Osijek</span>
      <span class="badge-chip" id="listing-count">Učitavanje...</span>
    </div>
    <div class="quick-filters">
      <button class="filter-btn active" data-filter="all">Svi stanovi</button>
      <button class="filter-btn" data-filter="budget-400">Do 400 €</button>
      <button class="filter-btn" data-filter="budget-500">Do 500 €</button>
      <button class="filter-btn" data-filter="pet">🐾 Pet friendly</button>
      <button class="filter-btn" data-filter="lift">🛗 Lift</button>
      <button class="filter-btn" data-filter="parking">🅿️ Parking</button>
      <button class="filter-btn active" id="toggle-pois">🏫 Pokaži POI</button>
    </div>
  </div>

  <!-- Map Container -->
  <div id="map"></div>

  <script>
    // Initialize Telegram WebApp integration
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      if (tg.colorScheme === 'dark') {
        document.body.classList.add('dark-mode');
      }
    }

    // Centered at Osijek center
    const OSIJEK_CENTER = [45.5550, 18.6955];
    const map = L.map('map', {
      zoomControl: true,
      attributionControl: false
    }).setView(OSIJEK_CENTER, 13);

    // Light / Dark CartoDB basemap
    const isDark = document.body.classList.contains('dark-mode');
    const tileLayerUrl = isDark
      ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
      : 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';

    L.tileLayer(tileLayerUrl, { maxZoom: 19 }).addTo(map);

    let allListings = [];
    let allPOIs = [];
    let listingsLayer = L.layerGroup().addTo(map);
    let poisLayer = L.layerGroup().addTo(map);
    let showPOIs = true;
    let activeFilter = 'all';

    // Sample fallback data in case external API is loading or offline
    const samplePOIs = [
      { name: "Sveučilišni kampus", lat: 45.5542, lon: 18.7032, icon: "🎓" },
      { name: "KBC Osijek (Bolnica)", lat: 45.5582, lon: 18.7115, icon: "🏥" },
      { name: "Trg Ante Starčevića", lat: 45.5601, lon: 18.6789, icon: "🏛️" },
      { name: "Tvrđa", lat: 45.5610, lon: 18.6960, icon: "🏰" },
      { name: "TC Portanova", lat: 45.5615, lon: 18.6280, icon: "🛍️" },
      { name: "Autobusni kolodvor", lat: 45.5528, lon: 18.6758, icon: "🚌" },
      { name: "Opus Arena (Pampas)", lat: 45.5650, lon: 18.6380, icon: "⚽" }
    ];

    function renderPOIs(pois) {
      poisLayer.clearLayers();
      pois.forEach(poi => {
        const markerIcon = L.divIcon({
          className: 'custom-poi-marker',
          html: `<div class="poi-marker">${poi.icon || '📍'} ${poi.name}</div>`,
          iconSize: null
        });
        L.marker([poi.lat || poi.latitude, poi.lon || poi.longitude], { icon: markerIcon })
          .bindPopup(`<b>${poi.name}</b><br><small>Ključna točka (POI)</small>`)
          .addTo(poisLayer);
      });
    }

    function renderListings(listings) {
      listingsLayer.clearLayers();
      let displayedCount = 0;

      listings.forEach(item => {
        if (!item.latitude || !item.longitude) return;

        // Apply filters
        if (activeFilter === 'budget-400' && item.price > 400) return;
        if (activeFilter === 'budget-500' && item.price > 500) return;
        if (activeFilter === 'pet' && !item.pet_friendly) return;
        if (activeFilter === 'lift' && !item.elevator) return;
        if (activeFilter === 'parking' && !item.parking) return;

        displayedCount++;

        let priceClass = 'medium';
        if (item.price <= 380) priceClass = 'cheap';
        else if (item.price >= 600) priceClass = 'expensive';

        const markerHtml = `<div class="price-marker ${priceClass}">${item.price} €</div>`;
        const markerIcon = L.divIcon({
          className: 'custom-price-marker',
          html: markerHtml,
          iconSize: [50, 24],
          iconAnchor: [25, 12]
        });

        // Badges
        const badges = [];
        if (item.pet_friendly) badges.push('🐾 Pet ok');
        if (item.elevator) badges.push('🛗 Lift');
        if (item.parking) badges.push('🅿️ Parking');
        if (item.utilities_included) badges.push('💡 Režije u cijeni');
        else if (item.utilities_est) badges.push(`💡 Režije ~${item.utilities_est}€`);

        const badgeHtml = badges.map(b => `<span class="tag-badge">${b}</span>`).join('');
        const areaText = item.area_sqm ? `${item.area_sqm} m²` : 'Nije navedeno';

        const popupContent = `
          <div class="listing-popup">
            <div class="popup-title">${item.title}</div>
            <div class="popup-price">${item.price} € / mj.</div>
            <div class="popup-meta">📍 ${item.neighborhood || 'Osijek'} • 📐 ${areaText}</div>
            <div class="popup-badges">${badgeHtml}</div>
            <a href="${item.url}" target="_blank" class="popup-btn">Otvori oglas 🔗</a>
          </div>
        `;

        L.marker([item.latitude, item.longitude], { icon: markerIcon })
          .bindPopup(popupContent)
          .addTo(listingsLayer);
      });

      document.getElementById('listing-count').innerText = `${displayedCount} stanova`;
    }

    // Filter Buttons Handling
    document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.getAttribute('data-filter');
        renderListings(allListings);
      });
    });

    document.getElementById('toggle-pois').addEventListener('click', function() {
      showPOIs = !showPOIs;
      if (showPOIs) {
        this.classList.add('active');
        map.addLayer(poisLayer);
      } else {
        this.classList.remove('active');
        map.removeLayer(poisLayer);
      }
    });

    // Fetch listings from API (or load embed fallback)
    async function loadData() {
      try {
        const response = await fetch('/api/map_listings');
        if (response.ok) {
          const data = await response.json();
          allListings = data.listings || [];
          allPOIs = data.pois && data.pois.length ? data.pois : samplePOIs;
        } else {
          throw new Error('API offline');
        }
      } catch (err) {
        console.warn('API endpoint unavailable, using bundled data.', err);
        // Fallback sample listings for instant preview
        allListings = [
          { id: 1, title: "Dvosoban stan s balkonom u Retfali", price: 380, area_sqm: 52, neighborhood: "Retfala", latitude: 45.5600, longitude: 18.6500, pet_friendly: true, elevator: false, parking: true, url: "https://www.njuskalo.hr" },
          { id: 2, title: "Moderan stan u Centru, zgrada s liftom", price: 450, area_sqm: 45, neighborhood: "Centar", latitude: 45.5570, longitude: 18.6800, pet_friendly: false, elevator: true, parking: true, url: "https://www.njuskalo.hr" },
          { id: 3, title: "Garsonijera u Sjenjaku, blizina Kampusa", price: 320, area_sqm: 30, neighborhood: "Sjenjak", latitude: 45.5500, longitude: 18.7100, pet_friendly: false, elevator: true, parking: false, url: "https://www.index.hr" },
          { id: 4, title: "Prostran trosoban stan, Donji Grad", price: 550, area_sqm: 75, neighborhood: "Donji Grad", latitude: 45.5580, longitude: 18.7200, pet_friendly: true, elevator: false, parking: true, url: "https://www.facebook.com" },
          { id: 5, title: "Povoljan stan u Tvrđi", price: 300, area_sqm: 38, neighborhood: "Tvrđa", latitude: 45.5610, longitude: 18.6960, pet_friendly: true, elevator: false, parking: false, url: "https://www.index.hr" },
          { id: 6, title: "Novogradnja Industrijska četvrt", price: 420, area_sqm: 48, neighborhood: "Industrijska četvrt", latitude: 45.5420, longitude: 18.6750, pet_friendly: false, elevator: true, parking: true, url: "https://www.njuskalo.hr" },
          { id: 7, title: "Stan Jug 2 blizu tramvajske stanice", price: 350, area_sqm: 50, neighborhood: "Jug 2", latitude: 45.5400, longitude: 18.7150, pet_friendly: true, elevator: false, parking: true, url: "https://www.index.hr" }
        ];
        allPOIs = samplePOIs;
      }

      renderPOIs(allPOIs);
      renderListings(allListings);
    }

    loadData();
  </script>
</body>
</html>
